<?xml version="1.0" encoding="UTF-8"?>
<svg id="Capa_1" data-name="Capa 1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1042.3 612.44">
  <defs>
    <style>
      .cls-1 {
        fill: #69a1ac;
      }

      .cls-1, .cls-2, .cls-3, .cls-4, .cls-5, .cls-6, .cls-7, .cls-8, .cls-9, .cls-10 {
        fill-rule: evenodd;
      }

      .cls-2 {
        fill: #fff;
      }

      .cls-3 {
        fill: #ffd300;
      }

      .cls-4, .cls-7 {
        fill: #dde3e9;
      }

      .cls-5 {
        fill: #c1dee2;
      }

      .cls-6 {
        fill: #3a10e5;
      }

      .cls-7 {
        opacity: .54;
      }

      .cls-9 {
        fill: #ede4bc;
      }

      .cls-10 {
        fill: #89c5cc;
      }
    
      /* ===== ANIMACION +uno · Planear ===== */
      #hombre,#Whiteboard-Stuff{opacity:0}
      .sceno{opacity:0;animation:sceno-in .9s ease-out .1s forwards}
      @keyframes sceno-in{to{opacity:1}}

      #Leaf,#Leaf-2,#Leaf-3,#Leaf-4,#Leaf-5{transform-box:fill-box;transform-origin:50% 100%}
      #Leaf{animation:sway 4.2s ease-in-out infinite}
      #Leaf-2{animation:sway 4.8s ease-in-out infinite;animation-delay:-1.1s}
      #Leaf-3{animation:sway 5.2s ease-in-out infinite;animation-delay:-2.2s}
      #Leaf-4{animation:sway 4.6s ease-in-out infinite;animation-delay:-1.7s}
      #Leaf-5{animation:sway 5.6s ease-in-out infinite;animation-delay:-3s}
      @keyframes sway{0%,100%{transform:rotate(-2.4deg)}50%{transform:rotate(2.4deg)}}

      /* personaje entra deslizando desde la izquierda (caminando) */
      #hombre{transform-box:fill-box;animation:walk-in 9s ease-in-out infinite}
      @keyframes walk-in{
        0%,3%{opacity:0;transform:translateX(-46px)}
        16%{opacity:1;transform:translateX(0)}
        90%{opacity:1;transform:translateX(0)}
        97%,100%{opacity:0;transform:translateX(18px)}}

      /* organigrama: contenedor + piezas escalonadas */
      #Whiteboard-Stuff{animation:wb-env 9s ease-in-out infinite}
      @keyframes wb-env{0%,28%{opacity:0}35%{opacity:1}88%{opacity:1}95%,100%{opacity:0}}
      #Whiteboard-Stuff>path{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:wb-pop 9s ease-in-out infinite}
      @keyframes wb-pop{0%,30%{transform:scale(0)}39%{transform:scale(1.14)}44%{transform:scale(1)}100%{transform:scale(1)}}
      #Whiteboard-Stuff>path:nth-child(1){animation-delay:0.000s}#Whiteboard-Stuff>path:nth-child(2){animation-delay:0.045s}#Whiteboard-Stuff>path:nth-child(3){animation-delay:0.090s}#Whiteboard-Stuff>path:nth-child(4){animation-delay:0.135s}#Whiteboard-Stuff>path:nth-child(5){animation-delay:0.180s}#Whiteboard-Stuff>path:nth-child(6){animation-delay:0.225s}#Whiteboard-Stuff>path:nth-child(7){animation-delay:0.270s}#Whiteboard-Stuff>path:nth-child(8){animation-delay:0.315s}#Whiteboard-Stuff>path:nth-child(9){animation-delay:0.360s}#Whiteboard-Stuff>path:nth-child(10){animation-delay:0.405s}#Whiteboard-Stuff>path:nth-child(11){animation-delay:0.450s}#Whiteboard-Stuff>path:nth-child(12){animation-delay:0.495s}#Whiteboard-Stuff>path:nth-child(13){animation-delay:0.540s}#Whiteboard-Stuff>path:nth-child(14){animation-delay:0.585s}#Whiteboard-Stuff>path:nth-child(15){animation-delay:0.630s}#Whiteboard-Stuff>path:nth-child(16){animation-delay:0.675s}#Whiteboard-Stuff>path:nth-child(17){animation-delay:0.720s}#Whiteboard-Stuff>path:nth-child(18){animation-delay:0.765s}

      @media (prefers-reduced-motion: reduce){
        *{animation:none!important}
        #hombre,#Whiteboard-Stuff,#Whiteboard-Stuff>path,.sceno{opacity:1!important;transform:none!important}
      }

    </style>
  </defs>
