      /* ===== ANIMACION +uno · Desarrollar y lanzar ===== */
      #char-a,#char-b,#ventana{opacity:0}
      .sceno{opacity:0;animation:sceno-in .9s ease-out .1s forwards}
      @keyframes sceno-in{to{opacity:1}}

      #leaf,#leaf1,#leaf2{transform-box:fill-box;transform-origin:50% 100%}
      #leaf{animation:sway 4.2s ease-in-out infinite}
      #leaf1{animation:sway 4.8s ease-in-out infinite;animation-delay:-1.2s}
      #leaf2{animation:sway 5.3s ease-in-out infinite;animation-delay:-2.4s}
      @keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}

      /* cliente entra primero, agencia un tiempo despues; ambos caminan hacia la web */
      #char-a{transform-box:fill-box;animation:walk-a 9s ease-in-out infinite}
      #char-b{transform-box:fill-box;animation:walk-b 9s ease-in-out infinite}
      @keyframes walk-a{0%,3%{opacity:0;transform:translateX(-58px)}15%{opacity:1;transform:translateX(0)}86%{opacity:1;transform:translateX(0)}94%,100%{opacity:0;transform:translateX(20px)}}
      @keyframes walk-b{0%,22%{opacity:0;transform:translateX(-58px)}34%{opacity:1;transform:translateX(0)}86%{opacity:1;transform:translateX(0)}94%,100%{opacity:0;transform:translateX(20px)}}

      /* la web aparece y se carga bloque por bloque */
      #ventana{transform-box:fill-box;transform-origin:72% 40%;animation:win-in 9s ease-in-out infinite}
      @keyframes win-in{0%,38%{opacity:0;transform:scale(.9)}45%{opacity:1;transform:scale(1)}86%{opacity:1;transform:scale(1)}94%,100%{opacity:0;transform:scale(.95)}}
      #ventana rect.tech{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:tech-pop 9s ease-in-out infinite}
      @keyframes tech-pop{0%,46%{transform:scale(0)}54%{transform:scale(1.08)}59%{transform:scale(1)}100%{transform:scale(1)}}

      @media (prefers-reduced-motion: reduce){
        *{animation:none!important}
        #char-a,#char-b,#ventana,#ventana rect.tech,.sceno{opacity:1!important;transform:none!important}
      }

    </style>
